apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-web
  namespace: firefly
  labels:
    app: firefly
spec:
  replicas: 1
  selector:
    matchLabels: { app: firefly, tier: web }
  template:
    metadata:
      labels: { app: firefly, tier: web }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: hardware, operator: In, values: [rtx3090-x1] }
                  - { key: kubernetes.io/hostname, operator: In, values: [k3s-w5, k3s-w6] }
                  - { key: nvidia.com/gpu.present, operator: In, values: ["true"] }
      containers:
        - name: web
          image: firefly:latest
          imagePullPolicy: Never
          command: ["uvicorn", "serve.app:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: FIREFLY_DEVICE, value: cpu }
            - { name: FIREFLY_OUT, value: /library/datasets/firefly }
          ports:
            - { containerPort: 8000, name: http }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits:
              memory: 8Gi
              cpu: "3"
          volumeMounts:
            - { name: library, mountPath: /library }
      volumes:
        - name: library
          hostPath:
            path: /library
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-web
  namespace: firefly
spec:
  type: NodePort
  selector: { app: firefly, tier: web }
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30181
